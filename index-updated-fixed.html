<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#176b45">
  <title>Barangay Pineda | Training &amp; Seminar Management</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");


:root {
  font-family: "Inter", sans-serif;
  color: #26332c;
  background: #f7f9f8;
  font-synthesis: none;
  --green-900: #176b45;
  --green-700: #238354;
  --green-500: #3fa66b;
  --green-100: #e8f5ec;
  --green-50: #f4faf6;
  --surface: #ffffff;
  --background: #f7f9f8;
  --text: #26332c;
  --muted: #6b756f;
  --border: #dfe7e2;
  --border-light: #edf1ee;
  --warning: #e6a23c;
  --warning-bg: #fff6e7;
  --danger: #d9534f;
  --danger-bg: #fdf0ef;
  --shadow: 0 1px 2px rgba(25, 52, 37, 0.04), 0 7px 22px rgba(25, 52, 37, 0.04);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 1180px; min-height: 100vh; background: var(--background); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.5; }
p { margin: 0; }
.icon { flex: none; }
.heading { color: var(--text); line-height: 1.25; }
.heading-1 { font-size: 24px; font-weight: 650; letter-spacing: -0.02em; }
.heading-2 { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.heading-3 { font-size: 15px; font-weight: 600; }
.muted { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.5; }

.btn { border: 1px solid transparent; border-radius: 7px; min-height: 38px; padding: 0 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 600; transition: background 120ms ease, border-color 120ms ease; white-space: nowrap; }
.btn-primary { color: white; background: var(--green-900); }
.btn-primary:hover { background: #105a39; }
.btn-secondary { color: var(--green-900); background: white; border-color: var(--border); }
.btn-secondary:hover { background: var(--green-50); border-color: #bad8c6; }
.btn-ghost { color: var(--muted); background: transparent; padding: 0 8px; }
.btn-ghost:hover { color: var(--green-900); background: var(--green-50); }
.btn-danger { color: var(--danger); background: var(--danger-bg); border-color: #f3cfcd; }
.danger-text { color: var(--danger); }

.field { display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #3b4740; }
.field-wide { grid-column: 1 / -1; }
.field-control { width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 7px; background: white; color: var(--text); font-size: 13px; outline: none; }
.field-control::placeholder { color: #9ba49f; }
.field-control:focus { border-color: var(--green-500); box-shadow: 0 0 0 3px rgba(63, 166, 107, 0.12); }
select.field-control { padding-right: 34px; }
.textarea { padding-top: 11px; resize: vertical; line-height: 1.5; }
.search-box { position: relative; color: #8b9690; min-width: 230px; }
.search-box > .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); z-index: 1; }
.search-box .field-control { padding-left: 38px; min-height: 38px; }
.global-search { position: relative; }
.global-results { position: absolute; right: 0; top: calc(100% + 9px); width: 360px; padding: 7px; background: white; border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 18px 45px rgba(18, 44, 29, 0.16); z-index: 20; }
.global-result { width: 100%; min-height: 52px; justify-content: flex-start; text-align: left; padding: 7px 9px; }
.global-result > span:nth-child(2) { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
.global-result strong { color: var(--text); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.global-result small { color: var(--muted); font-size: 9px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.global-result-icon { width: 31px; height: 31px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--green-900); background: var(--green-100); }
.global-no-results { padding: 18px 12px; color: var(--muted); font-size: 11px; text-align: center; }

.card { background: var(--surface); border: 1px solid var(--border-light); border-radius: 10px; box-shadow: var(--shadow); }
.badge { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 999px; font-size: 11px; font-weight: 650; white-space: nowrap; }
.badge-green { color: var(--green-900); background: var(--green-100); }
.badge-amber { color: #926011; background: var(--warning-bg); }
.badge-gray { color: #617068; background: #eef2ef; }
.badge-red { color: #a33a37; background: var(--danger-bg); }

.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(145deg, #f7faf8 0%, #edf7f0 100%); position: relative; overflow: hidden; }
.login-glow { position: absolute; border-radius: 999px; background: rgba(63, 166, 107, 0.07); }
.login-glow-one { width: 500px; height: 500px; left: -170px; bottom: -230px; }
.login-glow-two { width: 360px; height: 360px; right: -100px; top: -150px; }
.login-card { width: 440px; padding: 38px 42px 34px; text-align: center; position: relative; z-index: 1; border-top: 4px solid var(--green-900); }
.seal { width: 60px; height: 60px; border-radius: 50%; background: var(--green-100); color: var(--green-900); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; border: 1px solid #cce5d5; }
.login-brand { font-size: 14px; font-weight: 700; color: var(--green-900); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.login-card .heading-1 { font-size: 23px; line-height: 1.35; }
.login-subtitle { margin-top: 8px; }
.login-form { display: grid; gap: 18px; text-align: left; margin-top: 30px; }
.login-button { width: 100%; margin-top: 4px; min-height: 44px; letter-spacing: 0.04em; }
.secure-note { display: flex; justify-content: center; align-items: center; gap: 7px; color: #89938e; font-size: 11px; margin-top: 22px; }
.secure-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green-500); }
.login-footer { font-size: 12px; color: #76817b; position: absolute; bottom: 26px; }
.login-footer span { color: var(--green-500); margin: 0 6px; }

.app-shell { min-height: 100vh; display: flex; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 244px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 22px 14px 16px; z-index: 10; }
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 23px; border-bottom: 1px solid var(--border-light); }
.brand-mark { width: 41px; height: 41px; border-radius: 9px; color: white; background: var(--green-900); display: flex; align-items: center; justify-content: center; }
.brand-name { font-size: 15px; font-weight: 700; color: var(--green-900); }
.brand-subtitle { margin-top: 3px; font-size: 9px; color: var(--muted); line-height: 1.3; }
.nav-label { color: #97a19b; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 21px 11px 8px; }
.nav-list { display: flex; flex-direction: column; gap: 3px; }
.nav-item { width: 100%; justify-content: flex-start; min-height: 42px; padding: 0 11px; color: #5d6962; font-weight: 500; }
.nav-item.active { color: var(--green-900); background: var(--green-100); font-weight: 650; }
.nav-item.active::before { content: ""; width: 3px; height: 18px; border-radius: 2px; background: var(--green-900); margin-left: -11px; }
.nav-item.active .icon { margin-left: 0; }
.sidebar-user { margin-top: auto; border-top: 1px solid var(--border-light); padding: 17px 5px 0; display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; color: var(--green-900); background: var(--green-100); display: flex; align-items: center; justify-content: center; }
.avatar.small { width: 32px; height: 32px; }
.user-copy { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.user-copy span { color: var(--muted); font-size: 9px; }
.user-copy strong { font-size: 12px; font-weight: 600; }
.logout-button { padding: 0; min-height: 32px; width: 32px; }

.main-shell { margin-left: 244px; min-height: 100vh; width: calc(100% - 244px); }
.topbar { height: 67px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; position: sticky; top: 0; z-index: 5; }
.breadcrumb { color: #8a958f; font-size: 12px; }
.breadcrumb span { margin: 0 8px; color: #c2cac5; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.header-actions .search-box { width: 245px; }
.icon-button { width: 38px; padding: 0; position: relative; }
.notification-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--danger); top: 8px; right: 9px; border: 1px solid white; }
.header-divider { width: 1px; height: 30px; background: var(--border); margin: 0 5px; }
.header-profile { display: flex; align-items: center; gap: 9px; min-width: 145px; }
.header-profile > div:last-child { display: flex; flex-direction: column; gap: 2px; }
.header-profile strong { font-size: 11px; font-weight: 650; }
.header-profile span { font-size: 9px; color: var(--muted); }
.content { padding: 28px 30px 42px; max-width: 1540px; margin: 0 auto; }
.page-intro { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 23px; min-height: 55px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 18px; }
.stat-card { padding: 19px; display: flex; align-items: flex-start; gap: 14px; }
.stat-icon { width: 43px; height: 43px; border-radius: 9px; color: var(--green-900); background: var(--green-100); display: flex; align-items: center; justify-content: center; }
.stat-copy { display: flex; flex-direction: column; }
.stat-copy > span { color: var(--muted); font-size: 12px; font-weight: 500; }
.stat-copy strong { font-size: 27px; line-height: 1.2; margin: 3px 0; letter-spacing: -0.02em; }
.stat-copy small { color: #8a958f; font-size: 10px; }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(310px, 0.75fr); gap: 18px; }
.section-card { overflow: hidden; }
.section-header { min-height: 75px; padding: 17px 19px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-light); gap: 20px; }
.section-header .field-control { min-width: 150px; min-height: 38px; }

.table-wrap { width: 100%; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { height: 43px; background: #fafcfb; color: #758079; font-size: 10px; font-weight: 650; text-align: left; text-transform: uppercase; letter-spacing: 0.035em; border-bottom: 1px solid var(--border-light); padding: 0 16px; white-space: nowrap; }
td { height: 62px; padding: 10px 16px; border-bottom: 1px solid var(--border-light); color: #46524b; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fbfdfb; }
.empty-state { min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #98a19c; gap: 7px; }
.empty-state strong { color: #5f6b64; font-size: 12px; }
.empty-state span { font-size: 10px; }
.primary-cell, .date-cell { font-weight: 600; color: var(--text); min-width: 175px; }
.primary-cell span, .date-cell span { display: block; font-size: 10px; color: var(--muted); font-weight: 400; margin-top: 4px; }
.date-cell { min-width: 110px; }
.table-actions { display: flex; gap: 2px; }
.table-actions .btn { width: 29px; height: 29px; min-height: 29px; padding: 0; }
.table-footer { min-height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-top: 1px solid var(--border-light); font-size: 11px; color: var(--muted); }
.table-footer > div { display: flex; gap: 7px; }
.table-footer .btn { min-height: 32px; padding: 0 11px; font-size: 11px; }
.filter-bar { min-height: 69px; padding: 14px 17px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-light); }
.filter-bar .field-control { min-height: 38px; min-width: 160px; }
.filter-bar .search-box { margin-right: auto; min-width: 280px; }

.activity-list { padding: 4px 17px 9px; }
.activity-item { display: grid; grid-template-columns: 35px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--border-light); }
.activity-item:last-child { border-bottom: 0; }
.activity-icon { width: 34px; height: 34px; border-radius: 8px; color: var(--green-900); background: var(--green-100); display: flex; align-items: center; justify-content: center; }
.activity-item > div:nth-child(2) { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.activity-item strong { font-size: 11px; font-weight: 600; }
.activity-item span { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.activity-item time { font-size: 9px; color: #9aa39e; align-self: start; padding-top: 3px; }

.form-card { max-width: 900px; margin: 0 auto; padding: 25px 28px; }
.form-section-title { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; margin-bottom: 23px; border-bottom: 1px solid var(--border-light); }
.section-number { width: 36px; height: 36px; border-radius: 50%; background: var(--green-100); color: var(--green-900); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 22px; }
.form-actions { display: flex; justify-content: flex-end; gap: 9px; padding-top: 23px; margin-top: 25px; border-top: 1px solid var(--border-light); }
.person-cell { display: flex; align-items: center; gap: 10px; min-width: 145px; }
.person-cell strong { font-weight: 600; color: var(--text); }
.initial-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--green-100); color: var(--green-900); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(21, 35, 27, 0.46); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 30px; }
.modal { width: 620px; max-height: 90vh; overflow: auto; background: white; border-radius: 11px; box-shadow: 0 24px 70px rgba(18, 44, 29, 0.2); padding: 0 25px 24px; }
.modal-wide { width: 850px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 21px 0 18px; margin-bottom: 22px; border-bottom: 1px solid var(--border-light); }
.modal-close { font-size: 24px; font-weight: 400; width: 34px; padding: 0; }
.modal-form { gap: 17px; }
.detail-list { border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; }
.detail-row { display: grid; grid-template-columns: 145px 1fr; min-height: 48px; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--border-light); font-size: 12px; }
.detail-row:last-child { border-bottom: 0; }
.detail-row span { color: var(--muted); }
.detail-row strong { font-weight: 600; }
.delete-confirmation { display: flex; align-items: flex-start; gap: 14px; padding: 4px 0 8px; }
.delete-icon { width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--danger); background: var(--danger-bg); }
.delete-confirmation strong { font-size: 14px; }
.delete-confirmation p { color: var(--muted); font-size: 11px; margin-top: 7px; line-height: 1.5; }

.schedule-layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; }
.schedule-list { padding: 0 18px; }
.schedule-item { min-height: 99px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border-light); }
.schedule-item:last-child { border-bottom: 0; }
.date-badge { width: 52px; height: 60px; border-radius: 8px; background: var(--green-900); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.date-badge strong { font-size: 21px; line-height: 1; }
.date-badge span { font-size: 9px; letter-spacing: 0.1em; margin-top: 5px; }
.schedule-main { flex: 1; }
.schedule-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; }
.schedule-meta span { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
.schedule-summary { padding: 22px; align-self: start; text-align: center; }
.schedule-summary .heading-2 { text-align: left; }
.month-number { width: 82px; height: 82px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--green-100); color: var(--green-900); font-size: 32px; font-weight: 700; margin: 28px auto 8px; }
.schedule-summary > p { color: var(--muted); font-size: 12px; margin-bottom: 26px; }
.summary-line { display: flex; justify-content: space-between; border-top: 1px solid var(--border-light); padding: 14px 0 0; margin-top: 14px; font-size: 11px; color: var(--muted); }
.summary-line strong { color: var(--text); }

.attendance-selector { display: flex; align-items: end; gap: 30px; padding: 18px 20px; margin-bottom: 15px; }
.attendance-selector .field { width: 390px; }
.event-date { display: flex; flex-direction: column; gap: 8px; padding-bottom: 4px; }
.event-date > span { font-size: 11px; font-weight: 600; color: var(--muted); }
.event-date strong { font-size: 13px; display: flex; gap: 7px; align-items: center; }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
.mini-stats .card { padding: 17px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: none; border-left: 3px solid #91a199; }
.mini-stats .card.present { border-left-color: var(--green-500); }
.mini-stats .card.absent { border-left-color: var(--danger); }
.mini-stats span { color: var(--muted); font-size: 12px; }
.mini-stats strong { font-size: 21px; }
.attendance-progress { color: var(--green-900); background: var(--green-100); padding: 7px 10px; border-radius: 6px; font-size: 10px; font-weight: 600; }
.attendance-toggle { display: flex; gap: 6px; }
.attendance-toggle .btn { min-height: 32px; padding: 0 10px; font-size: 11px; }

.certificate { background: #f3f1e9; padding: 18px; }
.certificate-border { border: 3px double var(--green-900); min-height: 455px; text-align: center; padding: 28px 55px 25px; position: relative; background: #fffef9; }
.certificate-border::before, .certificate-border::after { content: ""; position: absolute; width: 55px; height: 55px; border-color: var(--green-500); }
.certificate-border::before { top: 8px; left: 8px; border-top: 2px solid; border-left: 2px solid; }
.certificate-border::after { right: 8px; bottom: 8px; border-right: 2px solid; border-bottom: 2px solid; }
.certificate-seal { width: 52px; height: 52px; margin: 0 auto 7px; color: var(--green-900); }
.certificate-barangay { font-size: 15px; color: var(--green-900); font-weight: 700; letter-spacing: 0.12em; }
.certificate-city { font-size: 9px; color: var(--muted); letter-spacing: 0.18em; margin-top: 3px; }
.certificate-title { font-family: Georgia, serif; font-size: 34px; color: var(--green-900); letter-spacing: 0.07em; margin-top: 20px; }
.certificate-type { color: var(--green-500); font-weight: 700; font-size: 11px; letter-spacing: 0.25em; margin-bottom: 18px; }
.certificate-border p { font-family: Georgia, serif; font-size: 12px; color: #687169; margin: 8px 0; }
.certificate-name { width: 60%; margin: 9px auto; padding-bottom: 5px; border-bottom: 1px solid var(--green-900); font-family: Georgia, serif; font-style: italic; font-size: 29px; color: var(--green-900); }
.certificate-border > strong { font-family: Georgia, serif; color: var(--text); font-size: 15px; }
.signature-row { display: flex; justify-content: space-around; margin-top: 32px; }
.signature-row > div { display: flex; flex-direction: column; width: 180px; }
.signature-row span { border-top: 1px solid #7c847f; padding-top: 5px; font-family: Georgia, serif; font-size: 11px; font-weight: 600; }
.signature-row small { color: var(--muted); font-size: 8px; margin-top: 3px; }

.report-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 18px; }
.report-card { padding: 20px; }
.report-icon { width: 44px; height: 44px; border-radius: 9px; background: var(--green-100); color: var(--green-900); display: flex; align-items: center; justify-content: center; margin-bottom: 17px; }
.report-card p { color: var(--muted); font-size: 11px; line-height: 1.6; min-height: 36px; margin: 8px 0 13px; }
.report-count { color: var(--green-900); font-size: 10px; font-weight: 650; padding: 8px 0 14px; border-top: 1px solid var(--border-light); }
.report-card .btn { width: 100%; }
.report-builder { padding: 22px; }
.report-controls { display: grid; grid-template-columns: 1.2fr 1fr 1fr auto; gap: 12px; align-items: end; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border-light); }

@media (max-width: 1250px) {
  .content { padding-left: 22px; padding-right: 22px; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .activity-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .report-grid { grid-template-columns: repeat(2, 1fr); }
}

  </style>
</head>

  <div id="root"></div>

  <!-- React and Babel are loaded from public CDNs so the app can run from one HTML file. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>

  <script id="app-source" type="text/plain">

  const { createElement, useState } = React;

const STORE = {
  participants: "bp_participants_v1",
  trainings: "bp_trainings_v1",
  attendance: "bp_attendance_v1",
  settings: "bp_settings_v1"
};
function readStore(key, fallback) {

function dateLabel(value) {

function Icon({ name, size = 18 }: { name: IconName; size?: number }) {
  return (
    <svg className="icon" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {iconPaths[name]}
    </svg>
  );
}

type ButtonProps = ButtonHTMLAttributes<HTMLButtonElement> & {
  variant?: "primary" | "secondary" | "ghost" | "danger";
  icon?: IconName;
};

function Button({ children, variant = "primary", icon, className = "", ...props }: ButtonProps) {
  return createElement(
    "button",
    { className: `btn btn-${variant} ${className}`, ...props },
    icon ? <Icon name={icon} size={16} /> : null,
    children,
  );
}

function Input(props: InputHTMLAttributes<HTMLInputElement>) {
  return createElement("input", { className: `field-control ${props.className ?? ""}`, ...props });
}

function Select({ children, ...props }: SelectHTMLAttributes<HTMLSelectElement>) {
  return createElement("select", { className: `field-control ${props.className ?? ""}`, ...props }, children);
}

function Textarea(props: TextareaHTMLAttributes<HTMLTextAreaElement>) {
  return createElement("textarea", { className: `field-control textarea ${props.className ?? ""}`, ...props });
}

function Heading({ children, level = 1, className = "" }: { children: ReactNode; level?: 1 | 2 | 3; className?: string }) {
  return <div role="heading" aria-level={level} className={`heading heading-${level} ${className}`}>{children}</div>;
}

function Field({ label, children, wide = false }: { label: string; children: ReactNode; wide?: boolean }) {
  return <label className={`field ${wide ? "field-wide" : ""}`}><span>{label}</span>{children}</label>;
}

function SearchBox({ placeholder = "Search...", value, onChange }: Pick<InputHTMLAttributes<HTMLInputElement>, "placeholder" | "value" | "onChange">) {
  return <div className="search-box"><Icon name="search" size={17} /><Input aria-label={placeholder} placeholder={placeholder} value={value} onChange={onChange} /></div>;
}

function Card({ children, className = "" }: { children: ReactNode; className?: string }) {
  return <div className={`card ${className}`}>{children}</div>;
}

function Badge({ children, tone = "green" }: { children: ReactNode; tone?: "green" | "amber" | "gray" | "red" }) {
  return <span className={`badge badge-${tone}`}>{children}</span>;
}

function ActionButtons({ onView, onEdit, onDelete }: { onView?: () => void; onEdit?: () => void; onDelete?: () => void }) {
  return <div className="table-actions"><Button variant="ghost" title="View" aria-label="View" onClick={onView}><Icon name="eye" size={16} /></Button><Button variant="ghost" title="Edit" aria-label="Edit" onClick={onEdit}><Icon name="edit" size={16} /></Button><Button variant="ghost" className="danger-text" title="Delete" aria-label="Delete" onClick={onDelete}><Icon name="trash" size={16} /></Button></div>;
}

function DataTable({ headers, rows }: { headers: string[]; rows: ReactNode[][] }) {
  return (
    <div className="table-wrap">

      </table>
    </div>
  );
}

function Trainings({ setPage }: { setPage: (page: Page) => void }) {
  const [rows, setRows] = useState(() => initialTrainings().map((x:any) => [x.title,x.category,dateLabel(x.date),x.time,x.speaker||"—",x.max||"0",x.status||"Upcoming",x.id]));
  const [query, setQuery] = useState("");
  const [category, setCategory] = useState("");
  const [status, setStatus] = useState("");
  const [viewing, setViewing] = useState<string[] | null>(null);
  const [editing, setEditing] = useState<{ index: number; row: string[] } | null>(null);
  const [deleting, setDeleting] = useState<{ index: number; row: string[] } | null>(null);
  const filteredRows = rows.map((row, index) => ({ row, index })).filter(({ row }) => {
    const matchesQuery = row.join(" ").toLowerCase().includes(query.trim().toLowerCase());
    return matchesQuery && (!category || row[1] === category) && (!status || row[6] === status);
  });
  const saveEdit = () => {
    if (!editing) return;
    setRows((current) => { const next=current.map((row,index)=>index===editing.index?editing.row:row); const objects=next.map((r:any)=>({id:r[7]||"t"+Date.now()+Math.random(),title:r[0],category:r[1],date:(r[2]||"").replace(/\//g,"-"),time:r[3],speaker:r[4],max:r[5],status:r[6],location:""})); writeStore(STORE.trainings,objects); return next; });
    setEditing(null);
  };
  const deleteTraining = () => {
    if (!deleting) return;
    setRows((current) => { const next=current.filter((_,index)=>index!==deleting.index); writeStore(STORE.trainings,next.map((r:any)=>({id:r[7]||"t"+Date.now(),title:r[0],category:r[1],date:r[2],time:r[3],speaker:r[4],max:r[5],status:r[6],location:""}))); return next; });
    setDeleting(null);
  };
  const updateEditField = (index: number, value: string) => setEditing((current) => current ? { ...current, row: current.row.map((field, fieldIndex) => fieldIndex === index ? value : field) } : null);
  return (
    <>
      <PageIntro title="Trainings & Seminars" subtitle="Manage all barangay learning programs and activities" action={<Button icon="plus" onClick={() => setPage("Add New Training")}>Add New Training</Button>} />
      <Card className="section-card">
        <div className="filter-bar"><SearchBox placeholder="Search training..." value={query} onChange={(event) => setQuery(event.target.value)} /><Select aria-label="Filter by category" value={category} onChange={(event) => setCategory(event.target.value)}><option value="">All Categories</option><option>Health</option><option>Livelihood</option><option>Environment</option><option>Women's Programs</option><option>Safety</option></Select><Select aria-label="Filter by status" value={status} onChange={(event) => setStatus(event.target.value)}><option value="">All Statuses</option><option>Upcoming</option><option>Ongoing</option><option>Completed</option></Select></div>
        <DataTable headers={["Training Title", "Category", "Date & Time", "Speaker", "Participants", "Status", "Actions"]} rows={filteredRows.map(({ row: r, index }) => [
          <div className="primary-cell">{r[0]}<span>{r[1]} Program</span></div>,
          r[1],
          <div className="date-cell">{r[2]}<span>{r[3]}</span></div>,
          r[4],
          r[5],
          <Badge tone={r[6] === "Completed" ? "gray" : "green"}>{r[6]}</Badge>,
          <ActionButtons onView={() => setViewing(r)} onEdit={() => setEditing({ index, row: [...r] })} onDelete={() => setDeleting({ index, row: r })} />,
        ])} />
        <div className="table-footer"><span>Showing {filteredRows.length} of {rows.length} trainings</span><div><Button variant="secondary" disabled>Previous</Button><Button variant="secondary" disabled={filteredRows.length < 5}>Next</Button></div></div>
      </Card>
      {viewing && <Modal title="Training Details" subtitle="Complete program information" onClose={() => setViewing(null)}>
        <div className="detail-list">
          {[["Training Title", viewing[0]], ["Category", viewing[1]], ["Date", viewing[2]], ["Time", viewing[3]], ["Speaker", viewing[4]], ["Participants", `${viewing[5]} registered`], ["Status", viewing[6]]].map(([label, value]) => <div className="detail-row" key={label}><span>{label}</span><strong>{value}</strong></div>)}
        </div>
        <div className="form-actions"><Button variant="secondary" onClick={() => setViewing(null)}>Close</Button><Button icon="edit" onClick={() => { const index = rows.indexOf(viewing); setEditing({ index, row: [...viewing] }); setViewing(null); }}>Edit Training</Button></div>
      </Modal>}
      {editing && <Modal title="Edit Training" subtitle="Update the selected program" onClose={() => setEditing(null)}>

function Reports() {
  const [reportType, setReportType] = useState("Participant Report");
  const [range, setRange] = useState("All Records");
  const [format, setFormat] = useState("CSV Spreadsheet");
  const [preview, setPreview] = useState(null as any);
  const makeRows = (type:string) => {
    if (type === "Participant Report") return readStore(STORE.participants, []);
    if (type === "Training Report") return readStore(STORE.trainings, []);
    if (type === "Attendance Report") return readStore(STORE.attendance, []);
    if (type === "Speaker Report") return readStore("bp_speakers_v1", []);
    if (type === "Certificate Report") return readStore("bp_certificates_v1", []);
    return [];
  };
  const filteredRows = (type:string) => {
    const rows = makeRows(type);
    if (range === "All Records") return rows;
    const now = new Date();
    const cutoff = new Date(now);
    if (range === "Current Month") cutoff.setDate(1), cutoff.setHours(0,0,0,0);
    else if (range === "Last 3 Months") cutoff.setMonth(cutoff.getMonth()-3);
    else if (range === "This Year") cutoff.setMonth(0,1), cutoff.setHours(0,0,0,0);
    return rows.filter((row:any) => {
      const raw = row.date || row.registered || row.createdAt || row.created_at || "";
      if (!raw) return true;
      const date = new Date(raw);
      return isNaN(date.getTime()) || date >= cutoff;
    });
  };
  const csvCell = (value:any) => '"' + String(value == null ? "" : typeof value === "object" ? JSON.stringify(value) : value).replace(/"/g,'""') + '"';
  const downloadReport = (type:string) => {
    const rows = filteredRows(type);
    if (!rows.length) { alert("There are no "+type.toLowerCase()+" records to export yet. Add records first, then try again."); setPreview({type, rows:[]}); return; }
    const keys = Array.from(new Set(rows.flatMap((row:any) => Object.keys(row))));
    const csv = [keys.map(csvCell).join(","), ...rows.map((row:any) => keys.map((key:any)=>csvCell(row[key])).join(","))].join("\r\n");
    const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url; link.download = type.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    setPreview({type, rows});
  };
  const reports = [
    {title:"Participant Report", text:"Export registered participant records.", icon:"participants" as IconName},
    {title:"Attendance Report", text:"Export attendance by activity.", icon:"attendance" as IconName},
    {title:"Training Report", text:"Export training and meeting activities.", icon:"training" as IconName},
    {title:"Speaker Report", text:"Export saved speakers and resource persons.", icon:"speakers" as IconName}
  ];
  return <>
    <PageIntro title="Reports" subtitle="Generate and export records saved in this browser" action={<Button icon="download" onClick={()=>downloadReport(reportType)}>Generate Report</Button>} />
    <div className="report-grid">{reports.map((report) => {
      const count = makeRows(report.title).length;
      return <Card className="report-card" key={report.title}><div className="report-icon"><Icon name={report.icon} size={23} /></div><Heading level={2}>{report.title}</Heading><p>{report.text}</p><div className="report-count">{count} saved records</div><Button variant="secondary" onClick={()=>downloadReport(report.title)}>Export CSV <Icon name="arrow" size={15} /></Button></Card>;
    })}</div>
    <Card className="section-card report-builder">
      <div><Heading level={2}>Quick Report Generator</Heading><p className="muted">Choose a report and export its saved records as a spreadsheet-compatible CSV file.</p></div>
      <div className="report-controls">
        <Field label="Report Type"><Select value={reportType} onChange={(e)=>setReportType(e.target.value)}><option>Participant Report</option><option>Attendance Report</option><option>Training Report</option><option>Speaker Report</option><option>Certificate Report</option></Select></Field>
        <Field label="Date Range"><Select value={range} onChange={(e)=>setRange(e.target.value)}><option>All Records</option><option>Current Month</option><option>Last 3 Months</option><option>This Year</option></Select></Field>
        <Field label="Format"><Select value={format} onChange={(e)=>setFormat(e.target.value)}><option>CSV Spreadsheet</option></Select></Field>
        <Button icon="download" onClick={()=>downloadReport(reportType)}>Generate</Button>
      </div>
      {preview && <div style={{marginTop:18,padding:14,background:"#f4faf6",borderRadius:8,fontSize:12}}><strong>{preview.type}:</strong> {preview.rows.length} record(s) found. {preview.rows.length ? "The CSV export has been generated." : "No saved records were available for this report yet."}</div>}
    </Card>
  </>;
}

function Settings() {
  const defaults = {name:"Barangay Pineda",city:"City of Pasig",contact:"(02) 8XXX-XXXX",email:"barangaypineda@example.gov.ph",address:"Barangay Pineda Hall, Pineda, Pasig City",color:"#176b45",logo:""};
  const [form,setForm] = useState(() => ({...defaults,...readStore(STORE.settings,{})}));
  const [saved,setSaved] = useState(false);
  const save = () => {
    writeStore(STORE.settings,form);
    const root=document.documentElement;
    root.style.setProperty("--green-900",form.color);
    root.style.setProperty("--green-700",form.color);
    root.style.setProperty("--green-500",form.color);
    root.style.setProperty("--green-100",form.color+"22");
    document.querySelectorAll(".brand-name,.login-brand,.breadcrumb,.certificate-barangay").forEach((el:any)=>{el.textContent=el.classList.contains("breadcrumb") ? form.name+" / Settings" : form.name;});
    document.querySelectorAll(".brand-mark,.seal").forEach((el:any)=>{if(form.logo)el.innerHTML='<img alt="Barangay logo" src="'+form.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';});
    setSaved(true);
  };
  const change=(key:string,value:string)=>{setForm((f:any)=>({...f,[key]:value}));setSaved(false);};
  const upload=(file:any)=>{if(!file)return; if(file.size>1500000){alert("Please choose an image smaller than 1.5 MB.");return;}const reader=new FileReader();reader.onload=()=>change("logo",String(reader.result));reader.readAsDataURL(file);};
  return <>
    <PageIntro title="Settings" subtitle="Customize barangay information and system appearance" />
    <Card className="form-card">
      <div className="form-section-title"><div className="section-number"><Icon name="building" size={18}/></div><div><Heading level={2}>Barangay Information</Heading><p className="muted">Details shown in the system</p></div></div>
      <div className="form-grid">
        <Field label="Barangay Name"><Input value={form.name} onChange={e=>change("name",e.target.value)}/></Field>
        <Field label="City / Municipality"><Input value={form.city} onChange={e=>change("city",e.target.value)}/></Field>
        <Field label="Office Contact"><Input value={form.contact} onChange={e=>change("contact",e.target.value)}/></Field>
        <Field label="Official Email"><Input value={form.email} onChange={e=>change("email",e.target.value)}/></Field>
        <Field label="Office Address" wide><Input value={form.address} onChange={e=>change("address",e.target.value)}/></Field>
        <Field label="Main Theme Color"><Input type="color" value={form.color} onChange={e=>change("color",e.target.value)} /></Field>
        <Field label="Barangay Profile Picture / Logo"><Input type="file" accept="image/*" onChange={e=>upload(e.target.files?.[0])}/></Field>
        {form.logo && <div className="field field-wide"><span>Image preview</span><img src={form.logo} alt="Barangay logo preview" style={{width:100,height:100,objectFit:"cover",borderRadius:12,border:"1px solid var(--border)"}}/><Button variant="secondary" onClick={()=>change("logo","")}>Remove picture</Button></div>}
      </div>
      <div className="form-actions"><span className="muted">{saved ? "Settings saved in this browser." : "Changes apply after saving."}</span><Button icon="check" onClick={save}>Save Changes</Button></div>
    </Card>
  </>;
}


function AppContent({ page, setPage }: { page: Page; setPage: (page: Page) => void }) {
  if (page === "Dashboard") return <Dashboard setPage={setPage} />;
  if (page === "Trainings & Seminars") return <Trainings setPage={setPage} />;
  if (page === "Add New Training") return <AddTraining setPage={setPage} />;
  if (page === "Participants") return <Participants />;
  if (page === "Speakers") return <Speakers />;
  if (page === "Schedules") return <Schedules />;
  if (page === "Attendance") return <Attendance />;
  if (page === "Certificates") return <Certificates />;
  if (page === "Reports") return <Reports />;
  return <Settings />;
}

function App() {
  const [loggedIn, setLoggedIn] = useState(false);
  const [page, setPage] = useState<Page>("Dashboard");
  const savedSettings = readStore(STORE.settings, {});
  if (savedSettings.color) {
    document.documentElement.style.setProperty("--green-900", savedSettings.color);
    document.documentElement.style.setProperty("--green-700", savedSettings.color);
    document.documentElement.style.setProperty("--green-500", savedSettings.color);
  }
  if (!loggedIn) return <Login onLogin={() => setLoggedIn(true)} />;
  return (
    <div className="app-shell">
      <Sidebar currentPage={page} setPage={setPage} onLogout={() => setLoggedIn(false)} />
      <div className="main-shell">
        <Header page={page} setPage={setPage} />
        <main className="content"><AppContent page={page} setPage={setPage} /></main>
      </div>
    </div>
  );
}
</script>
  <script>
    window.addEventListener("load", function () {
      try {
        const source = document.getElementById("app-source").textContent;
        const compiled = Babel.transform(source, {
          filename: "app.tsx",
          presets: [
            ["typescript", { allExtensions: true, isTSX: true }],
            ["react", { runtime: "classic" }]
          ]
        }).code;
        const startApp = new Function("React", "ReactDOM", compiled + `
          const root = ReactDOM.createRoot(document.getElementById("root"));
          root.render(React.createElement(App));
        `);
        startApp(React, ReactDOM);
      } catch (error) {
        console.error("App startup error:", error);
        document.getElementById("root").innerHTML =
          '<div style="font-family:Arial;padding:24px;color:#a11"><h2>App could not start</h2><p>Open Chrome Console and send the red error message.</p></div>';
      }
    });
  </script>
</body>
